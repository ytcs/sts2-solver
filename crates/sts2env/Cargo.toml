[package]
name = "sts2env"
description = "Batched, auto-resetting RL environment over the STS2 combat simulator"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sts2sim = { path = "../sts2sim" }
rayon = "1"

[dev-dependencies]
sts2diff = { path = "../sts2diff" }
serde_json = "1"

[features]
obs_prof = ["sts2sim/obs_prof"]
obs_v3 = ["sts2sim/obs_v3"]
