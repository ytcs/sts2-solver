<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STS2 Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kreon:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121418; --panel: #121418; --panel2: #1c1f25; --line: #24272e; --line2: #31353e; --text: #e4e1d8; --dim: #96938b; --faint: #63625e;
  --gold: #e9c46a; --hp: #d64545; --hp-bg: #3a1c1c; --block: #5aa0e6; --good: #6cc070; --bad: #e0605a; --accent: #c9a2ff;
  --attack: #c2493f; --skill: #3f7fc2; --power: #c29a3f; --curse: #7a3fa0; --status: #6b6b6b; --quest: #3fa08a;
  --chosen: #1d2b20; --chosen-line: #6cc070; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
h1, h2, h3, .title { font-family: Kreon, Georgia, serif; font-weight: 700; margin: 0; }
a { color: var(--accent); }
.dim { color: var(--dim); } .faint { color: var(--faint); } .good { color: var(--good); } .bad { color: var(--bad); } .gold { color: var(--gold); }
pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin: 4px 0; color: #b9b5aa; }
details > summary { cursor: pointer; list-style: none; } details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "\25B8"; color: var(--faint); margin-right: 5px; display: inline-block; transition: transform .1s; font-size: 10px; }
details[open] > summary::before { transform: rotate(90deg); }
img { image-rendering: auto; }

/* layout */
#top { position: sticky; top: 0; z-index: 5; background: #121418f2; backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 7px 20px; }
#bar { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; }
#bar .stat { display: flex; align-items: center; gap: 5px; font-family: Kreon, Georgia, serif; font-size: 16px; }
#bar .stat img { width: 26px; height: 26px; object-fit: contain; }
#hpbar { width: 150px; height: 14px; background: var(--hp-bg); border-radius: 7px; overflow: hidden; position: relative; }
#hpbar > i { display: block; height: 100%; background: linear-gradient(#e85b5b, #a93333); }
#hpbar > span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 13px; font-weight: 600; text-shadow: 0 1px 1px #000; }
#pots, #relics { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.icon { width: 30px; height: 30px; object-fit: contain; vertical-align: middle; }
.icon.sm { width: 22px; height: 22px; }
.relicb { position: relative; display: inline-block; line-height: 0; }
.relicb > b { position: absolute; right: -3px; bottom: -3px; min-width: 12px; padding: 0 2px; border-radius: 6px; background: #000c; color: var(--text); font-size: 9.5px; line-height: 12px; text-align: center; pointer-events: none; }
.slot { width: 26px; height: 26px; border: 1px dashed var(--line2); border-radius: 50%; display: inline-block; margin: 0 2px; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 9px; background: var(--panel2); font-size: 11.5px; white-space: nowrap; }
#odds { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
#status { margin-left: auto; font-size: 11.5px; color: var(--dim); display: flex; gap: 8px; align-items: center; }
#status select { background: transparent; color: var(--dim); border: none; font-size: 11.5px; cursor: pointer; }
#status select option { background: var(--panel2); color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.dot.ok { background: var(--good); } .dot.stale { background: var(--gold); } .dot.err { background: var(--bad); }
main { display: grid; grid-template-columns: minmax(0, 1fr) var(--feedw, minmax(360px, 40%)); gap: 0; padding: 0 0 0 20px; align-items: start; }
main > div:first-child { padding: 16px 24px 32px 0; min-width: 0; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.panel { background: none; border: none; padding: 0; }
.panel + .panel { margin-top: 28px !important; }
.panel > h2 { font: 600 10.5px/1.2 "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.panel > h2 .small, .panel > h2 .dim, .panel > h2 .faint { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11.5px; color: var(--faint); }
#screenpanel > h2 #screenkind { font: 700 18px Kreon, Georgia, serif; text-transform: none; letter-spacing: 0; color: var(--text); }
#infopanel .sub + .sub { margin-top: 24px; }
#infopanel .shd { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
#infopanel .shd .title { font: 600 10.5px/1.2 "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); }
#infopanel .shd .small { font-size: 11.5px; color: var(--faint); }
#deckorder { margin-left: auto; background: none; color: var(--dim); border: none; font-size: 11.5px; padding: 0; cursor: pointer; }
#deckorder:hover { color: var(--text); }
#side { position: sticky; top: 50px; height: calc(100vh - 50px); display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--line); }
#mappanel { cursor: zoom-in; }
#feedgrip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; }
#feedgrip:hover, #feedgrip.drag { background: linear-gradient(90deg, transparent 3px, var(--line2) 3px, var(--line2) 5px, transparent 5px); }
body.resizing { cursor: col-resize; user-select: none; }
#mappop { position: fixed; inset: 0; z-index: 50; background: #000c; display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#mappop .inner { width: min(1500px, 100%); max-height: 100%; overflow: auto; background: var(--bg); border-radius: 10px; padding: 16px 20px; box-shadow: 0 10px 40px #000a; }
#mappop h2 { font: 600 10.5px "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
#mappop svg { max-width: none !important; }
#feedwrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 20px 24px 22px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
#feedwrap > h2 { position: sticky; top: -16px; background: var(--bg); padding: 2px 0 8px; margin: 0; z-index: 1; }
@media (max-width: 1000px) { #feedgrip { display: none; } main { padding: 0 16px; grid-template-columns: 1fr !important; } main > div:first-child { padding-right: 0; } #side { position: static; height: auto; border-left: none; border-top: 1px solid var(--line); } #feedwrap { padding: 16px 0; } }

/* combat */
#enemies { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: flex-end; min-height: 120px; }
.creature { display: flex; flex-direction: column; align-items: center; width: 210px; }
.creature .art { height: 170px; display: flex; align-items: flex-end; justify-content: center; }
.creature .art img { max-height: 170px; max-width: 205px; filter: drop-shadow(0 4px 6px #000a); }
.creature .art .ph { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#3a3f4c, #22252d); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-family: Kreon, serif; padding: 8px; }
.creature.dead { opacity: .35; }
.creature .name { font-family: Kreon, Georgia, serif; font-size: 15px; margin-top: 2px; text-align: center; }
.hpline { display: flex; align-items: center; gap: 4px; width: 100%; }
.hpline .bar { flex: 1; height: 10px; background: var(--hp-bg); border-radius: 5px; overflow: hidden; position: relative; }
.hpline .bar > i { display: block; height: 100%; background: var(--hp); }
.hpline .bar > span { position: absolute; inset: 0; font-size: 9.5px; line-height: 10px; text-align: center; font-weight: 600; text-shadow: 0 1px 1px #000; }
.blk { color: var(--block); font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; gap: 1px; }
.blk::before { content: "\26CA"; font-size: 12px; }
.powers { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; margin-top: 2px; }
.pw { position: relative; display: inline-block; }
.pw img { width: 24px; height: 24px; }
.pw b { position: absolute; right: -2px; bottom: -3px; font-size: 10px; background: #000c; border-radius: 5px; padding: 0 2px; }
.pw.txt { font-size: 10px; background: var(--panel2); border-radius: 4px; padding: 1px 4px; }
.intent { display: flex; align-items: center; gap: 3px; font-family: Kreon, serif; font-size: 16px; min-height: 30px; }
.intent img { width: 34px; height: 34px; }
.plan { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 3px; margin-top: 4px; width: 100%; font-family: Kreon, serif; font-size: 12px; }
.pturn { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line2); border-radius: 6px; padding: 1px 4px; }
.pturn > .k { color: var(--dim); font-size: 10px; margin-right: 1px; }
.parrow { color: var(--dim); font-size: 11px; }
.popt { display: inline-flex; align-items: center; gap: 1px; cursor: help; }
.popt + .popt { border-left: 1px dashed var(--line2); padding-left: 3px; margin-left: 1px; }
.popt img { width: 22px; height: 22px; }
.popt b { font-size: 11px; }
.popt i { font-style: normal; font-size: 9px; color: var(--dim); }
.popt.fx::after { content: "\2726"; font-size: 8px; color: var(--accent); margin-left: 1px; }
#player { display: grid; grid-template-columns: auto 1fr; gap: 14px; margin-top: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
#player .me { display: flex; flex-direction: column; align-items: center; width: 170px; }
#player .me .art img { max-height: 130px; max-width: 165px; }
.energy { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(#ffd27a, #b8741a); color: #1b1203; display: flex; align-items: center; justify-content: center; font: 700 18px Kreon, serif; box-shadow: 0 0 8px #e9a23b88; }
.orbs { display: flex; gap: 4px; align-items: flex-end; }
.orb { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--dim); }
.orb img { width: 40px; height: 40px; }
.piles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.pile summary { font-family: Kreon, serif; font-size: 13px; }
.pile .list { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; max-width: 520px; }
#hand { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }

/* card */
.card { width: 112px; border-radius: 7px; background: #23262d; border: 2px solid var(--status); position: relative; overflow: hidden; box-shadow: 0 1px 3px #0006; }
.card.Attack { border-color: var(--attack); } .card.Skill { border-color: var(--skill); } .card.Power { border-color: var(--power); }
.card.Curse { border-color: var(--curse); } .card.Status { border-color: var(--status); } .card.Quest { border-color: var(--quest); }
.card .ct { font: 700 12px/1.1 Kreon, Georgia, serif; text-align: center; padding: 4px 4px 3px 18px; background: #0006; height: 34px; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; }  /* fixed two-line title, name at the top: the art starts at the same height on every card */
.card .ct.up { color: var(--good); }
.card .pt { height: 78px; background: #111 center/cover no-repeat; }
.card .pt.none { display: flex; align-items: center; justify-content: center; color: var(--faint); font: 11px Kreon, serif; background: repeating-linear-gradient(45deg, #23262e, #23262e 6px, #262a33 6px, #262a33 12px); }
.card .cd { font-size: 10px; line-height: 1.25; padding: 3px 5px 5px; color: #d8d3c4; min-height: 30px; }
.card .ty { font-size: 9px; text-align: center; color: var(--dim); background: #0004; }
.card .cost { position: absolute; left: 1px; top: 1px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font: 700 13px Kreon, serif; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; background: center/contain no-repeat; }
.card .cost.noimg { background: radial-gradient(#ffd27a, #a8641a); border-radius: 50%; color: #1b1203; text-shadow: none; }
.card.unplayable { filter: grayscale(.6) brightness(.8); }
.card.sel { outline: 2px solid var(--chosen-line); outline-offset: 1px; }
.card { cursor: zoom-in; }
.card .star { position: absolute; right: 1px; top: 1px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font: 700 12px Kreon, serif; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000; background: center/contain no-repeat; }
.card .star.noimg { background: radial-gradient(#ffe9a0, #c9962a); border-radius: 50%; color: #1b1203; text-shadow: none; }
.card.hasstar .ct { padding-right: 18px; }
.card.mini .star { width: 16px; height: 16px; font-size: 10px; }
.card.mini.hasstar .ct { padding-right: 14px; }
.ico { height: 1.15em; width: auto; vertical-align: -3px; margin: 0 1px; }
.kwd { color: var(--gold); }
#cardpop { position: fixed; inset: 0; z-index: 50; background: #000b; display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#cardpop .big { width: min(320px, 100%); cursor: zoom-out; border-width: 3px; border-radius: 12px; }
#cardpop .big .ct { font-size: 19px; padding: 8px 34px 6px 40px; height: auto; min-height: 36px; align-items: center; }
#cardpop .big .cost, #cardpop .big .star { width: 40px; height: 40px; font-size: 21px; }
#cardpop .big .star { right: 2px; top: 2px; }
#cardpop .big .pt { height: 230px; }
#cardpop .big .ty { font-size: 12px; padding: 2px; }
#cardpop .big .cd { font-size: 14.5px; line-height: 1.45; padding: 10px 14px 12px; text-align: center; min-height: 70px; }
#cardpop .big .live, #cardpop .big .upgr { font-size: 12px; padding: 6px 12px 8px; border-top: 1px solid #0006; background: #0003; }
#cardpop .big .upgr .ico { height: 1.05em; }
.card.mini { width: 74px; } .card.mini .pt { height: 42px; } .card.mini .ct { font-size: 10px; padding-left: 14px; height: 29px; } .card.mini .cost { width: 16px; height: 16px; font-size: 10px; } .card.mini .cd, .card.mini .ty { display: none; }

/* options (non-combat screens) */
.opts { display: flex; flex-direction: column; }
.opt { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 6px 4px; }
.opts .opt:first-child { border-top: 1px solid var(--line); }
.opt .n { font: 600 12px var(--mono); color: var(--gold); width: 18px; text-align: right; flex: none; }
.opt .price { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
.opt.best .price { color: var(--good); font-weight: 700; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.cardopt { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.cardopt .n { font: 600 12px var(--mono); color: var(--gold); }
.cardopt { width: 116px; }
.cardopt .price { font-family: var(--mono); font-size: 10.5px; color: var(--dim); text-align: center; }
.cardopt.best .price { color: var(--good); font-weight: 700; }

/* map */
#map svg { width: 100%; height: auto; display: block; }
#map .edge { stroke: #4a4f5c; stroke-width: 2; stroke-dasharray: 4 4; }
#map .edge.done { stroke: var(--gold); stroke-width: 3.5; stroke-dasharray: none; }
#map .node circle.bg { fill: #2a2e38; stroke: #4a4f5c; }
#map .node.visited circle.bg { fill: #4a3f20; stroke: var(--gold); stroke-width: 2.5; }
#map .node.offer circle.bg { stroke: var(--good); stroke-width: 3; }
#map .node.here circle.bg { stroke: #fff; stroke-width: 3.5; }
#map .node text { fill: var(--text); font: 700 13px Kreon, serif; text-anchor: middle; }
#map .ptag { font: 600 11px var(--mono); fill: var(--good); }
.mapview svg { width: 100%; height: auto; display: block; }
.mapview .edge { stroke: #4a4f5c; stroke-width: 2; stroke-dasharray: 4 4; }
.mapview .edge.done { stroke: var(--gold); stroke-width: 3.5; stroke-dasharray: none; }
.mapview .edge.plan, #map .edge.plan { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; opacity: .85; }
.mapview .node circle.bg { fill: #2a2e38; stroke: #4a4f5c; }
.mapview .node.visited circle.bg { fill: #4a3f20; stroke: var(--gold); stroke-width: 2; }
.mapview .node.plan circle.bg, #map .node.plan circle.bg { stroke: var(--accent); stroke-width: 2.5; }
.mapview .node.here circle.bg { stroke: #fff; stroke-width: 3; }
.mapview .node text { fill: var(--text); font: 700 13px Kreon, serif; text-anchor: middle; }

/* feed */
.ev { padding: 12px 0 13px; border-bottom: 1px solid var(--line); }
.ev:first-child { padding-top: 4px; }
.ev .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.ev .k { font: 600 10.5px/1.2 "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); white-space: nowrap; }
.ev .k::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
.ev .t { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
.ev.macro .hd .k { color: var(--gold); } .ev.fight .hd .k { color: #e07a70; } .ev.potion .hd .k { color: var(--accent); } .ev.warn .hd .k { color: var(--bad); } .ev.calc .hd .k { color: #7aa7dc; }
.ev .hd .title { font-size: 15px; }
.ev .card.mini { width: 54px; border-width: 1.5px; } .ev .card.mini .pt { height: 30px; } .ev .card.mini .ct { font-size: 8px; height: 21px; padding: 2px 2px 1px 14px; } .ev .card.mini .cost { width: 13px; height: 13px; font-size: 8.5px; }
.chose { display: flex; gap: 10px; align-items: center; font-size: 13.5px; line-height: 1.4; }
.why::before { content: "why"; font: 600 9.5px "Segoe UI", system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #a8893a; margin-right: 8px; }
.why { margin: 6px 0 0; padding: 0 0 0 10px; border-left: 2px solid #5c4d22; color: #cfc6a8; font-size: 12.5px; line-height: 1.5; }
.choice { font-weight: 600; color: #f1eee6; }
table.pt { border-collapse: collapse; margin-top: 8px; font-size: 12px; width: 100%; }
table.pt th, table.pt td { padding: 3px 8px; text-align: right; white-space: nowrap; }
table.pt th:first-child, table.pt td:first-child { text-align: left; white-space: normal; padding-left: 4px; }
table.pt th { color: var(--faint); font-weight: 500; font-size: 11px; border-bottom: 1px solid var(--line); }
table.pt tr.chosen td { background: var(--chosen); color: #eef6ea; }
table.pt tr.chosen td:first-child { border-radius: 4px 0 0 4px; } table.pt tr.chosen td:last-child { border-radius: 0 4px 4px 0; }
table.pt td.best { color: var(--good); font-weight: 600; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 8px; align-items: center; font-size: 12px; padding: 1px 4px; }
.qrow.chosen { background: var(--chosen); border-radius: 4px; }
.qbar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.qbar > i { display: block; height: 100%; background: #4d76a8; }
.qrow.chosen .qbar > i { background: var(--good); }
.act { margin: 4px 0 0; }
.turnhd { font: 600 10px/1.2 "Segoe UI", system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin: 10px 0 2px; padding-top: 6px; border-top: 1px solid var(--line); }
.turnhd:first-child { margin-top: 4px; border-top: none; padding-top: 0; }
.act > summary { font-size: 12px; }
.ev details > summary { color: var(--faint); font-size: 11.5px; margin-top: 6px; }
.ev details[open] > summary { color: var(--dim); }
.ev .opts { margin-top: 6px; }
.ev .opt { padding: 3px 4px; font-size: 12px; }
.pred { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
.pred b { color: var(--text); font-weight: 600; }
.quantrow { display: flex; align-items: flex-end; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
.quantrow .qend { font: 500 11px var(--mono); color: var(--dim); line-height: 1; }
.quant { display: flex; height: 18px; align-items: flex-end; gap: 1px; }
.quant i { width: 7px; background: #3f4756; display: block; border-radius: 1px 1px 0 0; }
.quant i.hit { background: var(--bad); }
.quant i.dead { background: #6e2a2a; }
.quant i.dead.hit { background: var(--bad); }
.quant .gap { width: 4px; }
.small { font-size: 11px; }
.hidden { display: none !important; }
.empty { color: var(--faint); text-align: center; padding: 30px 0; font-family: Kreon, serif; font-size: 15px; }
</style>
</head>
<body>
<div id="top">
  <div id="bar">
    <span class="stat" id="who"><span class="dim">no run</span></span>
    <span class="stat" id="floor"></span>
    <span class="stat"><span id="hpicon"></span><span id="hpbar"><i style="width:0"></i><span></span></span></span>
    <span class="stat" id="gold"></span>
    <span id="pots"></span>
    <span id="relics"></span>

<script>
"use strict";
const S = { run: "", follow: true, offset: 0, events: [], live: null, liveTag: null, man: null, lastRuns: 0, open: {}, creatures: {}, spine: null, dirty: true, err: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 0) => (x == null || isNaN(x) ? "?" : (100 * x).toFixed(d) + "%");
const num = (x, d = 1) => (x == null || isNaN(x) ? "?" : (+x).toFixed(d));
const A = (p) => (p ? "/assets/" + p : "");
const ago = (t) => { if (!t) return ""; const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? `${s.toFixed(0)}s ago` : s < 5400 ? `${(s / 60).toFixed(0)} min ago` : `${(s / 3600).toFixed(1)} h ago`; };
const clock = (t) => (t ? new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "");
const titleCase = (id) => String(id || "").toLowerCase().replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

// ------------------------------------------------------------------ manifest (art + names)
const M = { cards: {}, relics: {}, potions: {}, powers: {}, orbs: {}, creatures: {}, encounters: {}, intents: {}, ui: {}, cardByTitle: {}, potionByTitle: {}, relicByTitle: {} };
async function loadManifest() {
  try {
    const r = await fetch("/assets/manifest.json");
    if (!r.ok) throw new Error(r.status);
    Object.assign(M, await r.json());
  } catch (e) { console.warn("no art manifest (run tools/dashboard/extract_assets.py)", e); }
  for (const [id, c] of Object.entries(M.cards)) (M.cardByTitle[c.title.toLowerCase()] ||= []).push(id);
  for (const [id, p] of Object.entries(M.potions)) M.potionByTitle[p.title.toLowerCase()] = id;
  for (const [id, p] of Object.entries(M.relics)) M.relicByTitle[p.title.toLowerCase()] = id;
  try {  // card costs (upgraded, stars) and full text: data/dashboard_cards.json (tools/dashboard/card_data.py)
    const r = await fetch("/api/cards");
    if (!r.ok) throw new Error(r.status);
    CD = (await r.json()).cards || {};
  } catch (e) { console.warn("no card table (run tools/dashboard/card_data.py): base costs from the manifest", e); }
}
let CD = {};
let CHAR = "";
function cardIdByName(name) {
  const ids = M.cardByTitle[String(name).toLowerCase().replace(/\+\d*$/, "").trim()];
  if (!ids) return null;
  return ids.find((i) => M.cards[i].color === CHAR.toLowerCase()) || ids.find((i) => M.cards[i].color === "colorless") || ids[0];
}
const cardTitle = (id) => (M.cards[id] ? M.cards[id].title : titleCase(id));
const relicTitle = (id) => (M.relics[id] ? M.relics[id].title : titleCase(id));
const powerTitle = (id) => (M.powers[id] ? M.powers[id].title : titleCase(String(id).replace(/_POWER$/, "")));
const creatureTitle = (id) => (M.creatures[id] ? M.creatures[id].title : titleCase(id));
const encTitle = (id) => (M.encounters[id] ? M.encounters[id].title : titleCase(id));

// costs: live values win (o.cost from the hand or the screen line; o.star: undefined = not known live, "" or null = none, -1 or "X" = X),
// else the card table (data/dashboard_cards.json: canonical cost + upgrade delta), else the art manifest's base cost
function cardCosts(id, o = {}) {
  const d = CD[id], c = M.cards[id] || {}, lv = o.upgrade || 0, isX = d ? d.x : c.x;
  let e;
  if (o.cost != null && o.cost !== "") e = o.cost === "X" || (o.cost < 0 && isX) ? "X" : o.cost < 0 ? "" : o.cost;
  else if (d) e = d.x ? "X" : d.cost < 0 ? "" : Math.max(0, d.cost + d.up_cost * lv);
  else e = c.x ? "X" : c.cost == null || c.cost < 0 ? "" : c.cost;
  let s = "";
  if (o.star !== undefined) s = o.star === "" || o.star == null ? "" : o.star === "X" || o.star === -1 ? "X" : o.star;
  else if (d && d.star !== -1) s = d.star === -2 ? "X" : Math.max(0, d.star + d.up_star * lv);
  return { e, s };
}
function cardText(id, lv) {  // the full card text at this upgrade level (table), or null
  const d = CD[id];
  return d && d.text ? d.text[Math.min(lv || 0, d.text.length - 1)] : null;
}
function energyImg(id) {
  const c = M.cards[id] || {};
  const color = c.color && M.ui["energy_" + c.color] ? c.color : CHAR.toLowerCase() || "colorless";
  return M.ui["energy_" + color] || M.ui.energy_colorless;
}
function richText(t, id) {  // table text -> HTML: [gold]..[/gold], [energy:N], [energy], [star:N], [star], newlines
  const ei = energyImg(id), si = M.ui.star_icon;
  const eic = ei ? `<img class="ico" src="${A(ei)}" alt="E">` : "E", sic = si ? `<img class="ico" src="${A(si)}" alt="*">` : "&#9733;";
  return esc(t).replace(/\[gold\]/g, `<span class="kwd">`).replace(/\[\/gold\]/g, "</span>")
    .replace(/\[energy:(\w+)\]/g, (m, n) => `${n}${eic}`).replace(/\[energy\]/g, eic)
    .replace(/\[star:(\w+)\]/g, (m, n) => (/^\d$/.test(n) && +n <= 4 ? sic.repeat(+n) : n + sic)).replace(/\[star\]/g, sic)
    .replace(/\n/g, "<br>");
}
const plainText = (t) => String(t || "").replace(/\[\/?gold\]/g, "").replace(/\[energy:(\w+)\]/g, "$1E").replace(/\[energy\]/g, "E")
  .replace(/\[star:(\d+)\]/g, (m, n) => "*".repeat(+n)).replace(/\[star\]/g, "*").replace(/\s+/g, " ").trim();
function cardHTML(id, o = {}) {
  const c = M.cards[id] || {};
  const up = o.upgrade > 0;
  const title = (c.title || titleCase(id) || o.name || "?") + (up ? "+" + (o.upgrade > 1 ? o.upgrade : "") : "");
  const { e: costTxt, s: starTxt } = cardCosts(id, o);
  const eimg = energyImg(id), simg = M.ui.star_icon;
  const unplay = (o.keywords || []).includes("Unplayable");
  const full = cardText(id, o.upgrade);
  const descHTML = o.desc != null ? esc(o.desc) : full != null ? richText(full, id) : esc(c.desc || "");
  const tip = o.desc ?? (full != null ? plainText(full) : c.desc || "");
  const type = c.type || (o.status ? "Status" : "");
  const data = `data-id="${esc(id)}" data-up="${esc(o.upgrade || 0)}" data-e="${esc(costTxt)}" data-s="${esc(starTxt)}"${o.desc != null ? ` data-live="${esc(o.desc)}"` : ""}${unplay ? ` data-unplay="1"` : ""}`;
  return `<div class="card ${esc(type)} ${o.mini ? "mini" : ""} ${unplay ? "unplayable" : ""} ${o.sel ? "sel" : ""} ${starTxt !== "" ? "hasstar" : ""}" ${data} title="${esc(title + (tip ? " - " + tip : ""))} (click: full card)">
    ${costTxt === "" || unplay ? "" : `<div class="cost ${eimg ? "" : "noimg"}" style="${eimg ? `background-image:url('${A(eimg)}')` : ""}">${esc(costTxt)}</div>`}
    ${starTxt === "" ? "" : `<div class="star ${simg ? "" : "noimg"}" style="${simg ? `background-image:url('${A(simg)}')` : ""}" title="star cost">${esc(starTxt)}</div>`}
    <div class="ct ${up ? "up" : ""}">${esc(title)}</div>
    ${c.img ? `<div class="pt" style="background-image:url('${A(c.img)}')"></div>` : `<div class="pt none">${esc(type || "card")}</div>`}
    <div class="ty">${esc([c.rarity, type].filter(Boolean).join(" "))}</div>
    <div class="cd">${descHTML}</div></div>`;
}
// ------------------------------------------------------------------ the full card, on click (one overlay at body level: the panels re-render)
function cardPopHTML(el) {
  const id = el.dataset.id, lv = +el.dataset.up || 0, c = M.cards[id] || {}, d = CD[id];
  const title = (c.title || titleCase(id)) + (lv > 0 ? "+" + (lv > 1 ? lv : "") : "");
  const e = el.dataset.e ?? "", s = el.dataset.s ?? "", live = el.dataset.live;
  const eimg = energyImg(id), simg = M.ui.star_icon;
  const full = cardText(id, lv);
  const liveDiffers = live != null && (full == null || plainText(full) !== live.replace(/\s*(\(can't afford\)|SALE)\s*$/g, "").trim());
  const canUp = d && d.max_upgrade > lv && d.text && d.text.length > lv + 1;
  let upLine = "";
  if (canUp) {
    const nc = cardCosts(id, { upgrade: lv + 1 });
    const costChange = nc.e !== cardCosts(id, { upgrade: lv }).e || nc.s !== cardCosts(id, { upgrade: lv }).s;
    upLine = `<div class="upgr"><span class="dim">upgraded${costChange ? ` (cost ${nc.e}${nc.s !== "" ? ` / ${nc.s}&#9733;` : ""})` : ""}:</span> ${richText(cardText(id, lv + 1), id)}</div>`;
  }
  return `<div class="big card ${esc(c.type || "")}">
    ${e === "" || el.dataset.unplay ? "" : `<div class="cost ${eimg ? "" : "noimg"}" style="${eimg ? `background-image:url('${A(eimg)}')` : ""}">${esc(e)}</div>`}
    ${s === "" ? "" : `<div class="star ${simg ? "" : "noimg"}" style="${simg ? `background-image:url('${A(simg)}')` : ""}">${esc(s)}</div>`}
    <div class="ct ${lv > 0 ? "up" : ""}">${esc(title)}</div>
    ${c.img ? `<div class="pt" style="background-image:url('${A(c.img)}')"></div>` : `<div class="pt none">${esc(c.type || "card")}</div>`}
    <div class="ty">${esc([c.rarity, c.type, c.color && c.color !== CHAR.toLowerCase() ? titleCase(c.color) : ""].filter(Boolean).join(" · "))}</div>
    <div class="cd">${full != null ? richText(full, id) : esc(live ?? c.desc ?? "")}</div>
    ${liveDiffers && full != null ? `<div class="live"><span class="dim">in game now:</span> ${esc(live)}</div>` : ""}
    ${upLine}</div>`;
}
function openCardPop(el) { const p = $("cardpop"); p.innerHTML = cardPopHTML(el); p.classList.remove("hidden"); }
function closeCardPop() { const p = $("cardpop"); p.classList.add("hidden"); p.innerHTML = ""; }
function iconHTML(kind, id, extra = "") {
  const tab = M[kind] || {}, e = tab[id] || {};
  const t = e.title || titleCase(id);
  return e.img ? `<img class="icon ${extra}" src="${A(e.img)}" title="${esc(t + (e.desc ? ": " + e.desc : ""))}" alt="${esc(t)}">` : `<span class="chip" title="${esc(e.desc || "")}">${esc(t)}</span>`;
}
// a header relic icon with its live counter (the game's DisplayAmount) as a badge; saved properties (Pen Nib's AttacksPlayed ...) in the tooltip
function relicBadgeHTML(r) {
  const icon = iconHTML("relics", r.id, "sm");
  const props = r.props ? Object.entries(r.props).map(([k, v]) => `${k} ${typeof v === "object" ? JSON.stringify(v) : v}`).join(", ") : "";
  if (r.counter == null && !props) return icon;
  const state = [r.counter != null ? `counter ${r.counter}` : "", props].filter(Boolean).join(", ");
  const tipped = icon.replace(/title="/, `title="[${esc(state)}] `);  // the icon's own tooltip (title: description), state first
  return `<span class="relicb">${tipped}${r.counter != null ? `<b>${esc(r.counter)}</b>` : ""}</span>`;
}
function powersHTML(list) {
  return `<div class="powers">${(list || []).map((p) => {
    const e = M.powers[p.id] || {}, t = powerTitle(p.id);
    return e.img ? `<span class="pw" title="${esc(t + " " + (p.amount ?? "") + (e.desc ? ": " + e.desc : ""))}"><img src="${A(e.img)}" alt=""><b>${esc(p.amount ?? "")}</b></span>`
      : `<span class="pw txt" title="${esc(e.desc || "")}">${esc(t)} ${esc(p.amount ?? "")}</span>`;
  }).join("")}</div>`;
}

// ------------------------------------------------------------------ creature art: one still frame of the Spine rig, drawn once per creature
function loadSpine() {
  if (S.spine) return S.spine;
  const tryLoad = (src) => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  S.spine = (M.vendor ? tryLoad(A(M.vendor)) : Promise.reject()).catch(() => tryLoad("https://unpkg.com/@esotericsoftware/spine-canvas@4.2.120/dist/iife/spine-canvas.js"))
    .then(() => window.spine).catch(() => null);
  return S.spine;
}
function creatureArt(id) {
  if (S.creatures[id] !== undefined) return S.creatures[id];
  const c = M.creatures[id];
  if (!c || (!c.dir && !c.img)) return (S.creatures[id] = Promise.resolve(null));
  if (c.img && !c.dir) return (S.creatures[id] = Promise.resolve(A(c.img)));
  S.creatures[id] = loadSpine().then((spine) => spine ? drawRig(spine, c) : null).catch((e) => { console.warn("rig", id, e); return null; });
  return S.creatures[id];
}
async function drawRig(spine, c) {
  const am = new spine.AssetManager(A(c.dir) + "/");
  am.loadBinary("skeleton.skel");
  am.loadTextureAtlas("skeleton.atlas");
  await new Promise((res, rej) => { const t = setInterval(() => { if (am.isLoadingComplete()) { clearInterval(t); am.hasErrors() ? rej(am.getErrors()) : res(); } }, 50); });
  const data = new spine.SkeletonBinary(new spine.AtlasAttachmentLoader(am.require("skeleton.atlas"))).readSkeletonData(am.require("skeleton.skel"));
  const sk = new spine.Skeleton(data);
  const skin = [c.skin, "Default", "default"].find((n) => n && data.findSkin(n));
  if (skin) sk.setSkinByName(skin); else if (data.skins.length) sk.setSkin(data.skins[0]);
  sk.setToSetupPose();
  const anim = ["idle_loop", "idle", "combat_idle_loop", c.animation].find((n) => n && data.findAnimation(n)) || (data.animations[0] && data.animations[0].name);
  if (anim) { const st = new spine.AnimationState(new spine.AnimationStateData(data)); st.setAnimation(0, anim, false); st.update(0); st.apply(sk); }
  sk.scaleY = -1;  // canvas y points down
  sk.updateWorldTransform(spine.Physics ? spine.Physics.update : undefined);
  const off = new spine.Vector2(), size = new spine.Vector2();
  sk.getBounds(off, size, []);
  if (!(size.x > 0 && size.y > 0)) return null;
  const s = Math.min(1, 340 / Math.max(size.x, size.y));
  const cv = document.createElement("canvas");
  cv.width = Math.ceil(size.x * s); cv.height = Math.ceil(size.y * s);
  const ctx = cv.getContext("2d");
  ctx.scale(s, s); ctx.translate(-off.x, -off.y);
  const r = new spine.SkeletonRenderer(ctx);
  r.triangleRendering = true;
  r.draw(sk);
  return cv.toDataURL("image/png");
}
function hydrateCreatures(root) {
  root.querySelectorAll("[data-creature]").forEach((el) => {
    const id = el.dataset.creature;
    creatureArt(id).then((url) => { if (url && el.isConnected) el.innerHTML = `<img src="${url}" alt="${esc(creatureTitle(id))}">`; });
  });
}

// ------------------------------------------------------------------ screen text parsing
const HDR = /\bA(\d+) F(\d+)\s+([A-Z]+)(?:\s+A(\d+))?\s+HP (-?\d+)\/(\d+)\s+G(\d+)(?:\s+pots\[([^\]]*)\])?/;
function header(text) {
  const m = HDR.exec(text || "");
  return m ? { act: +m[1], floor: +m[2], char: m[3], asc: m[4] ? +m[4] : null, hp: +m[5], max: +m[6], gold: +m[7], pots: m[8] != null ? m[8].split(",").map((s) => s.trim()) : [] } : null;
}
const kindOf = (text) => (text || "").split("\n", 1)[0].split(" ")[0] || "";
function options(text) {
  const out = [];
  for (const l of (text || "").split("\n")) { const m = /^(\d+) (.*)$/.exec(l); if (m) out.push({ n: +m[1], label: m[2] }); }
  return out;
}
function parseCardLabel(label) {  // "Beam Cell(0) Deal 3 damage." / "(x) Defend(1) Gain 5 Block." / "51g card Beam Cell(0) ..." / Regent: "Resonance(1/2*) ...", "Stardust(0/X*) ..."
  const m = /^(?:(\d+)g (?:card )?)?(\(x\) )?([^()]+?)(\+\d*)?\((X|-?\d+)(?:\/(X|\d+)\*)?\)\s*(.*)$/.exec(label);
  if (!m) return null;
  const id = cardIdByName(m[3]);
  if (!id) return null;
  return { id, price: m[1] ? +m[1] : null, unplayable: !!m[2], upgrade: m[4] ? (m[4].length > 1 ? +m[4].slice(1) : 1) : 0,
    cost: m[5] === "X" ? "X" : +m[5], star: m[6] == null ? "" : m[6] === "X" ? "X" : +m[6], desc: m[7] };
}
function mapOptionCoord(label) { const m = /\br(\d+)c(\d+)\b/.exec(label || ""); return m ? `r${m[1]}c${m[2]}` : null; }
function chosenLabel(state, choice) {
  const opts = options(state), c = String(choice || "").trim();
  if (/^\d+/.test(c)) { const o = opts.find((x) => x.n === +c.split(/\s+/)[0]); return o ? o.label : c; }
  if (c.startsWith("~")) { const t = c.slice(1).split(/\s+/)[0].toLowerCase(); const o = opts.find((x) => x.label.toLowerCase().includes(t)); return o ? o.label : c; }
  return c;
}

// ------------------------------------------------------------------ derived run state from the record
function lastOf(kind, pred) { for (let i = S.events.length - 1; i >= 0; i--) { const e = S.events[i]; if (e.kind === kind && (!pred || pred(e))) return e; } return null; }
function currentScreen() {
  if (S.live && S.live.screen) return { text: S.live.screen, t: S.live.t_screen || S.live.t, live: true };
  const m = lastOf("macro");
  return m ? { text: m.state, t: m.t, live: false } : { text: "", t: null, live: false };
}
function knownRun() {  // relics / deck / potions: the live fight, else the latest fight start
  const f = S.live && S.live.fight, fs = lastOf("fight_start");
  const sc = (f && f.scenario) || (fs && fs.scenario) || null;
  const relicState = (f && f.state && f.state.relics) || (sc && sc.relics) || [];  // [{id, counter?, props?}]
  return { scenario: sc, relics: relicState.map((r) => r.id), relicState, deck: sc ? sc.deck : [] };
}
function mapText() {
  let best = null, bt = 0;
  const me = lastOf("map"); if (me) { best = me.text; bt = me.t; }
  if (S.live && /^\s*m\s*$/.test(S.live.cmd || "") && (S.live.reply || "").startsWith("rows") && S.live.t > bt) best = S.live.reply;
  return best;
}

// ------------------------------------------------------------------ header bar
function renderTop() {
  const scr = currentScreen(), h = header(scr.text) || header((lastOf("macro", (e) => header(e.state)) || {}).state || "");
  const run = knownRun();
  if (h) CHAR = h.char;
  else if (run.scenario) CHAR = run.scenario.character || CHAR;
  $("who").innerHTML = CHAR ? `<span class="title" style="font-size:18px">${esc(titleCase(CHAR))}</span>${h && h.asc != null ? `<span class="chip">${M.ui.top_bar_ascension ? `<img class="icon sm" src="${A(M.ui.top_bar_ascension)}">` : "A"}${h.asc}</span>` : ""}` : `<span class="dim">no run</span>`;
  $("floor").innerHTML = h ? `${M.ui.top_bar_floor ? `<img src="${A(M.ui.top_bar_floor)}">` : ""}Act ${h.act} &middot; Floor ${h.floor}` : "";
  const hp = h ? [h.hp, h.max] : null;
  $("hpicon").innerHTML = M.ui.top_bar_heart ? `<img src="${A(M.ui.top_bar_heart)}">` : "HP";
  $("hpbar").querySelector("i").style.width = hp ? Math.max(0, Math.min(100, (100 * hp[0]) / hp[1])) + "%" : "0";
  $("hpbar").querySelector("span").textContent = hp ? `${hp[0]} / ${hp[1]}` : "";
  $("gold").innerHTML = h ? `${M.ui.top_bar_gold ? `<img src="${A(M.ui.top_bar_gold)}">` : ""}<span class="gold">${h.gold}</span>` : "";
  $("pots").innerHTML = h ? h.pots.map((p) => p === "-" ? `<span class="slot" title="empty slot"></span>` : iconHTML("potions", M.potionByTitle[p.toLowerCase()] || p)).join("") : "";
  $("relics").innerHTML = run.relicState.map(relicBadgeHTML).join("");
  const odds = ((S.live && S.live.reply) || "").split("\n").find((l) => l.startsWith("public odds:"));
  $("odds").textContent = odds || "";
  $("odds").classList.toggle("hidden", !odds);
}

// ------------------------------------------------------------------ main screen
function renderScreen() {
  const scr = currentScreen(), text = scr.text || "", kind = kindOf(text);
  $("mappanel").classList.toggle("hidden", kind === "MAP");  // the MAP screen draws the full map itself
  $("screenkind").textContent = kind ? titleCase(kind) : "Screen";
  $("screensub").textContent = scr.t && !scr.live ? "from the record" : "";

  const want = ['<option value="">current run' + (j.current ? ` (${j.current})` : "") + "</option>"].concat(j.runs.map((r) => `<option value="${esc(r)}">${esc(r)}</option>`)).join("");

  const run = S.follow ? j.current || "" : sel.value;
  if (run !== S.run) { S.run = run; S.offset = 0; S.events = []; S.live = null; S.liveTag = null; S.dirty = true; }
}
async function pollLive() {
  if (!S.run) return;
  const r = await fetch(`/api/live?run=${encodeURIComponent(S.run)}`, { headers: S.liveTag ? { "If-None-Match": S.liveTag } : {} });
  if (r.status === 304) return;
  if (r.status === 404) { if (S.live) { S.live = null; S.dirty = true; } return; }
  if (!r.ok) throw new Error("live " + r.status);
  S.liveTag = r.headers.get("ETag");
  try { S.live = await r.json(); S.dirty = true; } catch (e) { /* mid-replace: next poll */ }
}
async function pollEvents() {
  if (!S.run) return false;
  let grew = false;
  for (let guard = 0; guard < 50; guard++) {
    const j = await getJSON(`/api/events?run=${encodeURIComponent(S.run)}&from=${S.offset}`);
    if (!j || j.run !== S.run) break;
    if (j.start < S.offset) { S.events = []; grew = true; }
    if (j.events.length) { S.events.push(...j.events); grew = true; }
    S.offset = j.next;
    if (j.next >= j.size || !j.events.length) break;
  }
  return grew;
}
async function tick() {
  try {
    if (Date.now() - S.lastRuns > 4000) { await pollRuns(); S.lastRuns = Date.now(); }
    await pollLive();
    const grew = await pollEvents();
    if (grew) { renderFeed(); S.dirty = true; }
    if (S.dirty) { renderTop(); renderScreen(); renderMiniMap(); S.dirty = false; }
    const t = Math.max((S.live && S.live.t) || 0, (S.events.length && S.events[S.events.length - 1].t) || 0);
    const age = t ? Date.now() / 1000 - t : null;
    $("dot").className = "dot " + (age == null ? "" : age < 120 ? "ok" : "stale");
    $("age").textContent = t ? `updated ${ago(t)}` : S.run ? "no activity yet" : "no run";
    S.err = null;
  } catch (e) {
    $("dot").className = "dot err"; $("age").textContent = "server unreachable"; S.err = e;
  }
  setTimeout(tick, document.hidden ? 5000 : 1000);
}
document.addEventListener("toggle", (ev) => {
  const d = ev.target; if (!(d instanceof HTMLDetailsElement)) return;
  if (d.dataset.k) S.open[d.dataset.k] = d.open;
}, true);
document.addEventListener("click", (ev) => {  // a card opens its full view; any click (or Esc) closes it
  if (!$("cardpop").classList.contains("hidden")) { closeCardPop(); return; }
  if (!$("mappop").classList.contains("hidden")) { closeMapPop(); return; }
  const el = ev.target.closest && ev.target.closest(".card[data-id]");
  if (el) { openCardPop(el); return; }
  if (ev.target.closest && ev.target.closest("#mappanel")) { $("mappop").classList.remove("hidden"); renderBigMap(); }
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { closeCardPop(); closeMapPop(); } });
// the decision feed's width: drag its left edge (remembered in this browser; double-click resets)
const FEEDW_KEY = "sts2dash.feedWidth";
const setFeedW = (px) => { if (px) document.querySelector("main").style.setProperty("--feedw", px + "px"); else document.querySelector("main").style.removeProperty("--feedw"); };
try { const w = +localStorage.getItem(FEEDW_KEY); if (w > 0) setFeedW(Math.min(w, innerWidth - 360)); } catch (e) { /* default width */ }
$("feedgrip").addEventListener("mousedown", (ev) => {
  ev.preventDefault();
  const grip = $("feedgrip");
  grip.classList.add("drag"); document.body.classList.add("resizing");
  let w = null;
  const right = document.querySelector("main").getBoundingClientRect().right;
  const move = (e) => { w = Math.round(Math.max(280, Math.min(right - 380, right - e.clientX))); setFeedW(w); };
  const up = () => {
    grip.classList.remove("drag"); document.body.classList.remove("resizing");
    removeEventListener("mousemove", move); removeEventListener("mouseup", up);
    if (w) try { localStorage.setItem(FEEDW_KEY, String(w)); } catch (e) { /* not remembered */ }
  };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
$("feedgrip").addEventListener("dblclick", () => { setFeedW(null); try { localStorage.removeItem(FEEDW_KEY); } catch (e) { /* nothing stored */ } });
$("deckorder").addEventListener("click", () => {
  S.deckOrder = S.deckOrder === "acq" ? "alpha" : "acq";
  try { localStorage.setItem(DECK_ORDER_KEY, S.deckOrder); } catch (e) { /* not persisted: still switches */ }
  renderDeck();
});
$("runsel").addEventListener("change", () => { S.follow = !$("runsel").value; S.lastRuns = 0; });
loadManifest().then(tick);
</script>
