[workspace]
resolver = "2"
members = ["crates/sts2sim", "crates/sts2diff", "crates/sts2env", "crates/sts2py"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
debug = true
